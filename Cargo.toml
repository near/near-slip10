[package]
authors = ["Ngo Iok Ui <wusyong9104@gmail.com>", "NEAR DevEx team"]
categories = ["cryptography", "no-std"]
description = "SLIP-0010 ed25519 private key derivation — NEAR fork of the slip10 crate"
edition = "2021"
keywords = ["slip-0010", "slip-10", "slip10", "near"]
license = "MIT"
name = "near-slip10"
repository = "https://github.com/near/near-slip10"
readme = "README.md"
rust-version = "1.85"
version = "0.4.8"

[dependencies]
ed25519-dalek = { version = "3", default-features = false }
# Pinned to an exact version because we enable the `unstable` feature; any
# release that touches the PQDSA APIs needs an explicit rebench.
aws-lc-rs = { version = "1.18.0", default-features = false, features = [
    "alloc",
    "non-fips",
] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
bip39 = { version = "2", default-features = false, features = [
    "alloc",
], optional = true }
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
hex = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
proptest = { version = "1" }

[features]
default = []
mnemonic = ["dep:bip39"]
serde = ["dep:serde", "serde/alloc"]
